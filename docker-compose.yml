# Levanta todo el sistema: MySQL + backend (FastAPI) + frontend (React/nginx)
#   docker compose up --build
# Front: http://localhost:5173  ·  API/docs: http://localhost:8000/docs
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_2026
    volumes:
      # MySQL ejecuta estos scripts (por orden alfabético) solo la primera vez que crea el volumen
      - ./base_de_datos/tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
      - ./base_de_datos/triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./base_de_datos/users.sql:/docker-entrypoint-initdb.d/03_users.sql:ro
      - ./base_de_datos/data.sql:/docker-entrypoint-initdb.d/04_data.sql:ro
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
        test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -proot_dev_2026 -e \"SELECT 1 FROM campeonato_universitario.sancion_jugador LIMIT 1\" || exit 1"]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: campeonato_universitario
      DB_ADMIN_USER: torneo_admin
      DB_ADMIN_PASSWORD: admin_dev_2026
      DB_AUTH_USER: torneo_auth
      DB_AUTH_PASSWORD: auth_dev_2026
      DB_PLANILLERO_USER: torneo_planillero
      DB_PLANILLERO_PASSWORD: planillero_dev_2026
      # Solo para desarrollo/corrección: cambiar en un entorno real
      JWT_SECRET: cambiar-esta-clave-en-produccion-0123456789abcdef
      CORS_ORIGINS: http://localhost:5174
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:80"

volumes:
  db_data: